# Pages CMS: https://pagescms.org/docs/
# Sign in at https://app.pagescms.org with GitHub and open this repository.
# Saving commits to the branch you are editing (main deploys the site).
# Keep the post fields in sync with src/content.config.ts.

media:
  input: public/images/blog
  output: /images/blog
  rename: safe
  categories: [image]

content:
  - name: blog
    label: Writing
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    # The file name is the URL (/blog/<name>/). Editable when creating, then fixed.
    filename:
      template: "{slug}.md"
      field: create
    view:
      fields: [title, pubDate, draft]
      primary: title
      sort: [pubDate, title]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        description: One or two sentences shown in lists and the RSS feed.
        type: text
        required: true
      - name: pubDate
        label: Published
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: updatedDate
        label: Updated
        type: date
        default: ""
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: tags
        label: Tags
        type: string
        list: true
      - name: lang
        label: Language
        type: select
        default: en
        options:
          values:
            - name: en
              label: English
            - name: zh
              label: 中文
      - name: draft
        label: Draft (not published)
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown

  - name: site
    label: Homepage & profile
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Name, type: string }
      - { name: title, label: Browser title, type: string }
      - { name: description, label: Description, type: text }
      - { name: url, label: Site URL, type: string }
      - { name: email, label: Email, type: string }
      - name: heroStatement
        label: Hero statement
        description: Breaks onto a second line after the last comma.
        type: string
      - { name: heroDescription, label: Hero description lines, type: string, list: true }
      - { name: intro, label: Intro, type: text }
      - { name: summary, label: Summary, type: text }
      - { name: about, label: About paragraphs, type: text, list: true }
      - { name: now, label: Lately, type: string, list: true }
      - name: links
        label: Footer links
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: URL, type: string }
      - name: focusAreas
        label: Focus areas
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: kicker, label: Kicker, type: string }
          - { name: body, label: Body, type: text }
      - name: selectedWork
        label: Selected work
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: type, label: Type, type: string }
          - { name: year, label: Year, type: string }
          - { name: body, label: Body, type: text }
          - { name: href, label: Link, type: string }

settings:
  content:
    # Keep any front matter keys the form doesn't know about.
    merge: true
